schema: openocean.release/v1

release:
  version: auto
  profile: full
  title: "OpenOcean Field {version}"
  notes: auto

# Refs are pinned to the exact commits this release is validated at. Using
# `main` here makes the published code drift away from whatever was last
# validated every time a source repository advances: the 2026-09-09 validation
# sat 30-32 commits behind main within twelve days. Pin, then re-pin as part of
# accepting a new validation run.
sources:
  field_core:
    repository: OpenOceanAcoustic/OpenOcean-Field-Core
    ref: bd6637075f5b304ae783bc5e61f87ceaa608e8f8
  ray_mode:
    repository: OpenOceanAcoustic/OpenOcean-Field-RayMode
    ref: 96f7720500dec33b1a199bbf76e363ee96416c07
  normal_mode:
    repository: OpenOceanAcoustic/OpenOcean-Field-NormalMode
    ref: e7aabbe0cc7d9891c18746f7bce280975473b707
  pe:
    repository: OpenOceanAcoustic/OpenOcean-Field-PE
    ref: 6e71ad78e56b05943052e529aee0bbbaeb47eb07
  toolbox:
    repository: OpenOceanAcoustic/OpenOcean-Field-Toolbox
    ref: 8112c773d144d09ba38c8386cfec565f6a8b9ff5
  wi:
    repository: OpenOceanAcoustic/OpenOcean-Field-WI
    ref: 2d3f662c40f688f5aae17b31169bf77a71e0af21
    enabled: false
  couple:
    repository: OpenOceanAcoustic/OpenOcean-Field-Couple
    ref: 602e77d8e5eac68a5b60324e77cf58c4c309466f
    enabled: false

products:
  native:
    enabled: true
    platforms: [linux-x86_64, windows-x86_64]
    families: [field_core, ray_mode, normal_mode, pe]
    linkage: [shared, static]
    standalone_executables: true
  python:
    enabled: true
    platforms: [linux-x86_64, windows-x86_64]
    versions: [cp310, cp311, cp312, cp313, cp314]
    distribution: openocean-field
    import_package: openocean_field.sdk
    installer: true
  matlab:
    enabled: true
    platform: windows-x86_64
    minimum_release: R2023a
    test_release: R2025b
    toolbox_identifier: 48c2d99b-c630-5cdb-8f78-b7844ec5b673
    embed_native_runtime: true
  field_runner:
    enabled: true
    publish_asset: false
    backends:
      - ray_mode.bellhop.2d
      - ray_mode.bellhop.3d
      - ray_mode.bellhop.nx2d
      - normal_mode.kraken
      - normal_mode.krakenc
      - pe.ram
      - pe.ramgeo
      - pe.rams

output:
  checksums: sha256
  include_lock_file: true
  include_manifest: true
  include_test_summary: true
  include_raw_logs: false
