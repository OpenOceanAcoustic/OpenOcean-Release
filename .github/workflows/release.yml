name: OpenOcean sealed release
on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated request from main.py submit release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: openocean-build-server
  cancel-in-progress: false
jobs:
  seal:
    runs-on: [self-hosted, Linux, X64, openocean-release]
    timeout-minutes: 1440
    outputs:
      release_id: ${{ steps.seal.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install orchestrator dependencies
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/openocean-release-tools"
          "${RUNNER_TEMP}/openocean-release-tools/bin/python" -m pip install -r requirements.txt
      - name: Build and seal or verify existing seal
        id: seal
        shell: bash
        env:
          OPENOCEAN_RELEASE_REQUEST: ${{ inputs.request }}
          OPENOCEAN_RUNNER_CONFIG: ${{ vars.OPENOCEAN_RUNNER_CONFIG }}
          OOA_FIELD_READ_TOKEN: ${{ secrets.OOA_FIELD_READ_TOKEN }}
        run: |
          export OPENOCEAN_RUNNER_CONFIG="${OPENOCEAN_RUNNER_CONFIG:-$HOME/.config/openocean/runner.yaml}"
          "${RUNNER_TEMP}/openocean-release-tools/bin/python" main.py run-request release
  publish:
    needs: seal
    if: fromJSON(inputs.request).publish == true
    runs-on: [self-hosted, Linux, X64, openocean-release]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install orchestrator dependencies
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/openocean-release-tools"
          "${RUNNER_TEMP}/openocean-release-tools/bin/python" -m pip install -r requirements.txt
      - name: Publish sealed release
        shell: bash
        env:
          OPENOCEAN_RELEASE_REQUEST: ${{ inputs.request }}
          OPENOCEAN_SEALED_RELEASE_ID: ${{ needs.seal.outputs.release_id }}
          OPENOCEAN_RUNNER_CONFIG: ${{ vars.OPENOCEAN_RUNNER_CONFIG }}
          OOA_FIELD_READ_TOKEN: ${{ secrets.OOA_FIELD_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export OPENOCEAN_RUNNER_CONFIG="${OPENOCEAN_RUNNER_CONFIG:-$HOME/.config/openocean/runner.yaml}"
          "${RUNNER_TEMP}/openocean-release-tools/bin/python" main.py run-request release publish
